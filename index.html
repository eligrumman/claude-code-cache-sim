hile warm, and ${h(d)} again after it expires. Choose one hour when the likely reuse crosses a coffee break; choose five minutes for tight bursts where the cheaper initial write is likely to stay warm.`],script:ae,offLabel:"5-minute TTL",onLabel:"1-hour TTL",off:{ttl:"5m",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820},on:{ttl:"1h",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820}},{id:"keep-warm",eyebrow:"2 · KEEP-WARM",title:"Pay a little before expiry.",copy:"A timed read can preserve a valuable prefix across a known medium pause.",deep:[`Keep-warm sends a small request before expiry so the cached prefix is read and its lifetime is refreshed. The request is not free: this simulator bills the full cached prefix at the ${Ce.read}× cache-read rate. For the 68,000-token Sonnet prefix below, each warm read is ${h(f)}; rebuilding it with a five-minute write is ${h(_)}.`,"The decision is a break-even question, not a ritual. Add up the pings needed to bridge the pause and compare them with the rebuild they avoid. Use keep-warm for a known medium wait, then stop it when the session is truly idle; endless reads can eventually cost more than letting the prefix go cold once."],script:B,offLabel:"No pings",onLabel:"Keep-warm",off:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680},on:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680,keepWarm:!0}},{id:"same-prompt",eyebrow:"3 · SAME PROMPT",title:"Give subagents one shared prefix.",copy:"Subagents must share the same boilerplate prefix—system prompt, tools, skills, and project context—so it stays cached and is read cheaply instead of rebuilt.",deep:[`Prompt caches match a prefix, not the intent behind it. The first subagent below writes the shared instructions at ${Ce.w1h}×; each later subagent with the same prefix reads those tokens at ${Ce.read}×. A different leading message invalidates the cache from the first byte of divergence, and the miss cascades: the skills block,  arrive before the TTL. The ledger treats a gap shorter than the TTL as warm; a request at or beyond expiry writes the prefix again at ${Ce.w5m}× or ${Ce.w1h}× instead of reading it at ${Ce.read}×.`,"Approve only commands the workflow already trusts, such as a focused test or a read-only inspection. Keep destructive or surprising operations gated. The saving comes from removing safe, repetitive friction—not from weakening the boundary around risky actions."],script:H,offScript:ge,onScript:H,offLabel:"Manual",onLabel:"Auto-approve",off:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},on:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},startOn:!0}],we=[{id:"route",eyebrow:"1 · MODEL + EFFORT",title:"Match the brain to the job.",copy:"Route by the cost of being wrong: buy judgment where a mistake fans out, and buy throughput where the answer is easy to verify.",deep:[`Model choice changes the base price of every token: Haiku is ${h(na.haiku)}, Sonnet ${h(na.sonnet)}, Opus ${h(na.opus)}, and Fable ${h(na.fable)} per million input tokens before bucket multipliers. Effort changes the teaching workload's reasoning input and output, and output is billed at ${Ce.out}×, so premium model plus high effort compounds both axes.`,`For the plan, Sonnet-high costs ${h(x("Plan","sonnet","high"))}: architecture and sequencing justify judgment, while Haiku-high at ${h(x("Plan","haiku","high"))} is a false economy if a weak dependency map spawns seven bad implementation tasks, and Fable-high at ${h(x("Plan","fable","high"))} is usually unused headroom. A local, reversible hotfix is the opposite: Haiku-low is ${h(x("Hotfix","haiku","low"))}, while Opus-high is ${h(x("Hotfix","opus","high"))}; escalate only when the blast radius stops being local.`,`Debugging needs a wide hypothesis search, so the worked route spends ${h(x("Debug","opus","high"))} on Opus-high instead of ${h(x("Debug","sonnet","high"))} on a cheaper but underpowered pass whose missed hypothesis buys another edit-and-test loop. RCA also lands on Opus-high at ${h(x("RCA","opus","high"))}, because reproducing the failure and separating cause from symptom demands a defensible chain, not a plausible narrative. Code review is bounded but cross-file: Sonnet-medium costs ${h(x("Code review","sonnet","medium"))}, enough to trace contracts without pricing every diff as research.`,`Tests and docs are cheaper because their answers are externally checkable. Haiku-medium prices the testing job at ${h(x("Tests","haiku","medium"))}; the spec supplies the judgment and the runner supplies the verdict. Haiku-low prices docs at ${h(x("Docs","haiku","low"))}, while Fable-low costs ${h(x("Docs","fable","low"))} and cannot recover facts absent from the brief. “Bad” in the picker therefore means likely to create rework, “expensive” means capacity the task cannot use, and “good” means the least costly route whose failure mode you can tolerate.`]},{id:"main-context",eyebrow:"2 · MAIN AGENT",title:"The default agent carries the whole backpack.",copy:"A 1M-context main agent is powerful—and expensive when every request drags that prefix through the meter.",deep:[`The main agent's million-token context may contain useful history, but the meter sees input carried into this request—not how much of it the task actually needs. On Sonnet, a one-hour cold write of 1,000,000 tokens plus the review output is ${h(C.mainCold)}; the next warm message is still ${h(C.mainWarm)} because the whole prefix is read at ${Ce.read}× and output remains ${Ce.out}×. The scoped 14,000-token version with identical output is ${h(C.scopedCold)} cold and ${h(C.scopedWarm)} warm.`,"The backpack is worth carrying when the next request genuinely depends on decisions, failed attempts, and repository relationships already accumulated in it. Architecture synthesis, an incident command thread, and a cross-cutting refactor often do. A bounded review, test run, or documentation pass usually does not; give that work the relevant files and a short brief, then return a compact result. Context is not a trophy for session longevity—it is recurring input rent."]},{id:"delegate",eyebrow:"3 · DELEGATE",title:"Give subagents smaller backpacks.",copy:"A scoped subagent sees only the brief and files it needs.",deep:[`Delegation creates a new context boundary. A 260,000-token Sonnet subagent prefix costs 260,000 × ${Ce.w1h} × $${na.sonnet}/M = ${h(c)} for its first one-hour write, then 260,000 × ${Ce.read} × $${na.sonnet}/M = ${k(u)} per warm read—a ${Ce.w1h/Ce.read}× swing on the prefix. The alternative is not free: a long main session repeatedly reads its larger accumulated history even when the next job needs one directory.`,"Delegate work that can be specified narrowly, checked independently, and returned compactly: searches, bounded reviews, focused tests, and factual docs. Do not delegate a two-minute edit whose brief and result need more tokens than the work, a decision that depends on tacit conversation history, or parallel tasks that will collide in the same files. Keep cross-cutting decisions and final synthesis in the main agent. When several subagents share a stable instruction prefix, preserve it exactly and append the task-specific target afterward so later subagents can read rather than rewrite it."]},{id:"compact",eyebrow:"4 · AUTO-COMPACT",title:"Compress history before it owns you.",copy:"Compaction trades some detail for a smaller reusable prefix.",deep:[`Auto-compact replaces older conversation detail with a shorter working set. The engine compacts after ${Da.thresholdTok.toLocaleString()} history tokens and retains ${Da.workingSetTok.toLocaleString()}; at ${U.toLocaleString()} tokens it reads the history and emits a ${Da.summaryTok.toLocaleString()}-token Haiku summary for ${h($)}. Removing ${G.toLocaleString()} repeated tokens then saves ${h(Q)} on each warm Sonnet message, before any cold-write saving, so this worked case breaks even after ${K} subsequent warm turns. Compaction is a purchase: pay once for the summary, then earn it back only if the smaller history will be reused.`,"Compact when a coherent summary can replace old exploration and the session still has meaningful work ahead. Do not compact just before stopping, and preserve exact logs, quotations, or code outside the chat when later reasoning needs them verbatim. The useful summary records decisions, rejected hypotheses, invariants, and open questions; a vague recap saves tokens by discarding the very state the agent needed."]},{id:"lazy",eyebrow:"5 · LAZY-LOAD",title:"Load skills and MCPs when called.",copy:"Unused tool descriptions are still context.",deep:[`Skill instructions and MCP schemas are input tokens even when the task never calls them. The engine's eager tool bundle is ${mn.toLocaleString()} tokens; omitting it from a non-tool Sonnet turn saves ${h(R)} on a one-hour cold write or ${h(Te)} on a warm read. One turn is small, but an all-day session pays the warm amount repeatedly, and a changed prefix can pay the cold amount again.`,"Lazy-load when most turns do not need the capability and discovery is cheap. Eager loading is rational when nearly every next turn will call the same tools or when the schema itself is essential planning context; repeatedly discovering and rewriting an immediately needed capability wins nothing. Once loaded, keep the definition stable at the reusable front and put changing arguments later. As with compaction, this is a reuse calculation, not a cleanliness ritual."]}],q=[{id:"strategy",highlight:"strategy",eyebrow:"0.1 · STRATEGY",title:"Route the work—or route every task the same.",recipe:"route",copy:"Switch only the routing strategy while model, effort, volume, and compaction stay fixed. The comparison exposes the cost of sending every task through one expensive default.",deep:"Right-sizing is not shorthand for choosing the cheapest model. Each task keeps the least costly model-and-effort pairing that fits its judgme
