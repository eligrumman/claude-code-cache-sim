n reuse an exact prompt prefix. The first request is a cache write: ${he.w5m}× the model's input rate for five minutes or ${he.w1h}× for one hour. A hit during that window is only ${he.read}×. That makes a one-hour cold rebuild ${he.w1h/he.read}× the price of reading the same warm tokens.`,`Here is the useful gut check: a one-million-token Haiku prefix is ${p(u)} on its first five-minute write, ${p(d)} while warm, and ${p(u)} again after it expires. Choose one hour when the likely reuse crosses a coffee break; choose five minutes for tight bursts where the cheaper initial write is likely to stay warm.`],script:X,offLabel:"5-minute TTL",onLabel:"1-hour TTL",off:{ttl:"5m",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820},on:{ttl:"1h",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820}},{id:"keep-warm",eyebrow:"2 · KEEP-WARM",title:"Pay a little before expiry.",copy:"A timed read can preserve a valuable prefix across a known medium pause.",deep:[`Keep-warm sends a small request before expiry so the cached prefix is read and its lifetime is refreshed. The request is not free: this simulator bills the full cached prefix at the ${he.read}× cache-read rate. For the 68,000-token Sonnet prefix below, each warm read is ${p(h)}; rebuilding it with a five-minute write is ${p(m)}.`,"The decision is a break-even question, not a ritual. Add up the pings needed to bridge the pause and compare them with the rebuild they avoid. Use keep-warm for a known medium wait, then stop it when the session is truly idle; endless reads can eventually cost more than letting the prefix go cold once."],script:V,offLabel:"No pings",onLabel:"Keep-warm",off:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680},on:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680,keepWarm:!0}},{id:"same-prompt",eyebrow:"3 · SAME PROMPT",title:"Give subagents one shared prefix.",copy:"Subagents must share the same boilerplate prefix—system prompt, tools, skills, and project context—so it stays cached and is read cheaply instead of rebuilt.",deep:[`Prompt caches match a prefix, not the intent behind it. The first subagent below writes the shared instructions at ${he.w1h}×; each later subagent with the same prefix reads those tokens at ${he.read}×. A different leading message invalidates the cache from the first byte of divergence, and the miss cascades: the skills block, tools block, and everything downstream must be written again at full price.`,`That is a ${he.w1h/he.read}× cold-versus-warm gap before fresh task input and output are added. Keep the prefix byte-identical through the last shared breakpoint. Put the specific task last, after shared skills and tools, so a different tail never poisons the reusable head.`],script:pe,offScript:de,onScript:pe,offLabel:"Unique prompts",onLabel:"Same prompt",off:{ttl:"1h",model:"sonnet",prefixTok:44e3,workInTok:380,outputTok:520},on:{ttl:"1h",model:"sonnet",prefixTok:44e3,workInTok:380,outputTok:520},startOn:!0},{id:"large-context",eyebrow:"4 · LARGE CONTEXT",title:"Reuse the big prefix—or pay again.",copy:"A large context magnifies both the first cold write and every saving after it.",deep:[`Context is input on every request; caching only changes which input bucket receives it. Sonnet's base input price is ${p(Vt.sonnet)} per million tokens, so the 420,000-token prefix below costs ${p(b)} as a one-hour cold write and ${p(w)} as a warm read. A larger prefix makes both numbers larger in direct proportion.`,"Put stable system instructions, tool definitions, and repository context first, then append the changing task. That layout preserves a reusable prefix across turns. Cache eligibility thresholds are provider and model rules; because this pricing source declares no numeric minimum, the article does not fabricate one."],script:oe,offScript:W,onScript:oe,offLabel:"Rebuild each turn",onLabel:"Reuse prefix",off:{ttl:"1h",model:"sonnet",prefixTok:42e4,workInTok:1100,outputTok:1450},on:{ttl:"1h",model:"sonnet",prefixTok:42e4,workInTok:1100,outputTok:1450},startOn:!0},{id:"auto-approve",eyebrow:"5 · AUTO-APPROVE",title:"Fewer round-trips, fewer expiry chances.",copy:"Pre-approving safe, routine commands keeps related work inside the cache window.",deep:[`Auto-approve has no special discount. It changes the timeline: fewer approval turns and shorter pauses make the next real request more likely to arrive before the TTL. The ledger treats a gap shorter than the TTL as warm; a request at or beyond expiry writes the prefix again at ${he.w5m}× or ${he.w1h}× instead of reading it at ${he.read}×.`,"Approve only commands the workflow already trusts, such as a focused test or a read-only inspection. Keep destructive or surprising operations gated. The saving comes from removing safe, repetitive friction—not from weakening the boundary around risky actions."],script:H,offScript:le,onScript:H,offLabel:"Manual",onLabel:"Auto-approve",off:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},on:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},startOn:!0}],ve=[{id:"route",eyebrow:"1 · MODEL + EFFORT",title:"Match the brain to the job.",copy:"Route by the cost of being wrong: buy judgment where a mistake fans out, and buy throughput where the answer is easy to verify.",deep:[`Model choice changes the base price of every token: Haiku is ${p(Vt.haiku)}, Sonnet ${p(Vt.sonnet)}, Opus ${p(Vt.opus)}, and Fable ${p(Vt.fable)} per million input tokens before bucket multipliers. Effort changes the teaching workload's reasoning input and output, and output is billed at ${he.out}×, so premium model plus high effort compounds both axes.`,`For the plan, Sonnet-high costs ${p(_("Plan","sonnet","high"))}: architecture and sequencing justify judgment, while Haiku-high at ${p(_("Plan","haiku","high"))} is a false economy if a weak dependency map spawns seven bad implementation tasks, and Fable-high at ${p(_("Plan","fable","high"))} is usually unused headroom. A local, reversible hotfix is the opposite: Haiku-low is ${p(_("Hotfix","haiku","low"))}, while Opus-high is ${p(_("Hotfix","opus","high"))}; escalate only when the blast radius stops being local.`,`Debugging needs a wide hypothesis search, so the worked route spends ${p(_("Debug","opus","high"))} on Opus-high instead of ${p(_("Debug","sonnet","high"))} on a cheaper but underpowered pass whose missed hypothesis buys another edit-and-test loop. RCA also lands on Opus-high at ${p(_("RCA","opus","high"))}, because reproducing the failure and separating cause from symptom demands a defensible chain, not a plausible narrative. Code review is bounded but cross-file: Sonnet-medium costs ${p(_("Code review","sonnet","medium"))}, enough to trace contracts without pricing every diff as research.`,`Tests and docs are cheaper because their answers are externally checkable. Haiku-medium prices the testing job at ${p(_("Tests","haiku","medium"))}; the spec supplies the judgment and the runner supplies the verdict. Haiku-low prices docs at ${p(_("Docs","haiku","low"))}, while Fable-low costs ${p(_("Docs","fable","low"))} and cannot recover facts absent from the brief. “Bad” in the picker therefore means likely to create rework, “expensive” means capacity the task cannot use, and “good” means the least costly route whose failure mode you can tolerate.`]},{id:"main-context",eyebrow:"2 · MAIN AGENT",title:"The default agent carries the whole backpack.",copy:"A 1M-context main agent is powerful—and expensive when every request drags that prefix through the meter.",deep:[`The main agent's million-token context may contain useful history, but the meter sees input carried into this request—not how much of it the task actually needs. On Sonnet, a one-hour cold write of 1,000,000 tokens plus the review output is ${p(L.mainCold)}; the next warm message is still ${p(L.mainWarm)} because the whole prefix is read at ${he.read}× and output remains ${he.out}×. The scoped 14,000-token version
