allback. Production is untouched.",atMin:11}],M=he.map((pe,st)=>({...pe,atMin:[0,1,2,3,4,5,7,9,10,12,13,15][st]})),ie=he.map((pe,st)=>({...pe,atMin:[0,7,9,16,18,25,27,34,36,44,46,53][st]})),G=[{id:"ttl",eyebrow:"1 · CACHE TTL",title:"Five minutes or one hour?",copy:"A longer cache costs more to write, but survives the coffee-sized gaps that force a rebuild.",deep:[`The TTL controls how long the provider can reuse an exact prompt prefix. The first request is a cache write: ${Oe.w5m}× the model's input rate for five minutes or ${Oe.w1h}× for one hour. A hit during that window is only ${Oe.read}×. That makes a one-hour cold rebuild ${Oe.w1h/Oe.read}× the price of reading the same warm tokens.`,`Here is the useful gut check: a one-million-token Haiku prefix is ${f(d)} on its first five-minute write, ${f(v)} while warm, and ${f(d)} again after it expires. Choose one hour when the likely reuse crosses a coffee break; choose five minutes for tight bursts where the cheaper initial write is likely to stay warm.`],script:$,offLabel:"5-minute TTL",onLabel:"1-hour TTL",off:{ttl:"5m",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820},on:{ttl:"1h",model:"sonnet",prefixTok:92e3,workInTok:720,outputTok:820}},{id:"keep-warm",eyebrow:"2 · KEEP-WARM",title:"Pay a little before expiry.",copy:"A timed read can preserve a valuable prefix across a known medium pause.",deep:[`Keep-warm sends a small request before expiry so the cached prefix is read and its lifetime is refreshed. The request is not free: this simulator bills the full cached prefix at the ${Oe.read}× cache-read rate. For the 68,000-token Sonnet prefix below, each warm read is ${f(h)}; rebuilding it with a five-minute write is ${f(w)}.`,"The decision is a break-even question, not a ritual. Add up the pings needed to bridge the pause and compare them with the rebuild they avoid. Use keep-warm for a known medium wait, then stop it when the session is truly idle; endless reads can eventually cost more than letting the prefix go cold once."],script:Se,offLabel:"No pings",onLabel:"Keep-warm",off:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680},on:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680,keepWarm:!0}},{id:"same-prompt",eyebrow:"3 · SAME PROMPT",title:"One word can poison the shared prefix.",copy:"An identical opening lets the whole shared prefix read cheaply; change one word near the front and the big stable tools, skills, and MCP block after it is re-written at full price.",deep:["In the real HEY-versus-HELLO experiment, two byte-identical subagent prompts made the second request a cheap cache read of the shared ~26K prefix. Changing only HEY to HELLO broke the prefix match at that word: only ~12K stayed reusable and about half the prefix—~15K tokens—had to be re-written, including the ~9–10K tools, skills, and MCP block after the message. A changed byte near the front poisons the otherwise stable tail.","Keep the opening bytes identical across subagents, then put the variable task last, after shared skills and tools, so a different tail never poisons the reusable head. The sting is largest for heavy skills and MCP users: divergent chats or subagents otherwise pay to rewrite that large stable block every time."],script:ee,offScript:K,onScript:ee,offLabel:"Unique prompts",onLabel:"Same prompt",off:{ttl:"1h",model:"opus",prefixTok:26e3,workInTok:180,outputTok:260},on:{ttl:"1h",model:"opus",prefixTok:26e3,workInTok:180,outputTok:260},startOn:!0},{id:"memory-cost",eyebrow:"4 · MEMORY & CLAUDE.MD",title:"Updating CLAUDE.md isn't free.",copy:"CLAUDE.md and memory files live in the stable cached prefix; editing them every session forces the whole prefix to be re-written at write price next run instead of read warm.",deep:["Project memory and CLAUDE.md sit near the front of the prompt, inside the cached head. Edit them and, just like the same-prompt case, the cache breaks at the change: every stable token after it—tools, skills, and the rest of the context—is re-written at the write rate instead of read warm for roughly $0.10 on the dollar. A tiny daily “update your memory” ritual quietly re-pays the entire prefix every session.","If context must carry forward, hand it off in the conversation tail: put a short handoff note or message at the end instead of rewriting the cached head. Keep CLAUDE.md byte-identical across sessions, let volatile session-specific notes live at the back where they cannot poison the reusable prefix, and batch genuine CLAUDE.md changes rather than editing it every run."],script:ye,offScript:se,onScript:ye,offLabel:"Edit memory each session",onLabel:"Stable memory + tail handoff",off:{ttl:"1h",model:"sonnet",prefixTok:52e3,workInTok:220,outputTok:300},on:{ttl:"1h",model:"sonnet",prefixTok:52e3,workInTok:220,outputTok:300},startOn:!0},{id:"auto-approve",eyebrow:"5 · AUTO-APPROVE",title:"Fewer round-trips, fewer expiry chances.",copy:"Pre-approving safe, routine commands keeps related work inside the cache window.",deep:[`Auto-approve has no special discount. It changes the timeline: fewer approval turns and shorter pauses make the next real request more likely to arrive before the TTL. The ledger treats a gap shorter than the TTL as warm; a request at or beyond expiry writes the prefix again at ${Oe.w5m}× or ${Oe.w1h}× instead of reading it at ${Oe.read}×.`,"Approve only commands the workflow already trusts, such as a focused test or a read-only inspection. Keep destructive or surprising operations gated. The saving comes from removing safe, repetitive friction—not from weakening the boundary around risky actions."],script:M,offScript:ie,onScript:M,offLabel:"Manual",onLabel:"Auto-approve",off:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},on:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},startOn:!0}],_e=[{id:"route",eyebrow:"1 · MODEL + EFFORT",title:"Match the brain to the job.",copy:"Route by the cost of being wrong: buy judgment where a mistake fans out, and buy throughput where the answer is easy to verify.",deep:[`Model choice changes the base price of every token: Haiku is ${f(va.haiku)}, Sonnet ${f(va.sonnet)}, Opus ${f(va.opus)}, and Fable ${f(va.fable)} per million input tokens before bucket multipliers. Effort changes the teaching workload's reasoning input and output, and output is billed at ${Oe.out}×, so premium model plus high effort compounds both axes.`,`For the plan, Sonnet-high costs ${f(g("Plan","sonnet","high"))}: architecture and sequencing justify judgment, while Haiku-high at ${f(g("Plan","haiku","high"))} is a false economy if a weak dependency map spawns seven bad implementation tasks, and Fable-high at ${f(g("Plan","fable","high"))} is usually unused headroom. A local, reversible hotfix is the opposite: Haiku-low is ${f(g("Hotfix","haiku","low"))}, while Opus-high is ${f(g("Hotfix","opus","high"))}; escalate only when the blast radius stops being local.`,`Debugging needs a wide hypothesis search, so the worked route spends ${f(g("Debug","opus","high"))} on Opus-high instead of ${f(g("Debug","sonnet","high"))} on a cheaper but underpowered pass whose missed hypothesis buys another edit-and-test loop. RCA also lands on Opus-high at ${f(g("RCA","opus","high"))}, because reproducing the failure and separating cause from symptom demands a defensible chain, not a plausible narrative. Code review is bounded but cross-file: Sonnet-medium costs ${f(g("Code review","sonnet","medium"))}, enough to trace contracts without pricing every diff as research.`,`Tests and docs are cheaper because their answers are externally checkable. Haiku-medium prices the testing job at ${f(g("Tests","haiku","medium"))}; the spec supplies the judgment and the runner supplies the verdict. Haiku-low prices docs at ${f(g("Docs","haiku","low"))}, while Fable-low costs ${f(g("Docs","fable","low"))} and cannot recover facts absent from the brief. “Bad” in the picker therefore means likely to create rework, “expensive” means capacity the task cannot use, and “good” means the least costly route whose failure mode you can tolerate.`]},{id:"main-context",eyebrow:"2 · MAIN AGENT",title:"The default agent carries the whole backpack.",copy:"A 1M-context main agent is powerful—and expensive when every request drags that prefix through the meter.",deep:[`The main agent's million-token context may contain useful history, but the meter sees input carried into this request—not how much of it the task actually needs. On Sonnet, a one-hour cold write of 1,000,000 tokens plus the review output is ${f(k.mainCold)}; the next warm message is still ${f(k.mainWarm)} because the whole prefix is read at ${Oe.read}× and output remains ${Oe.out}×. The scoped 14,000-token version with identical output is ${f(k.scopedCold)} cold and ${f(k.scopedWarm)} warm.`,"The backpack is worth carrying when the next request genuinely depends on decisions, failed attempts, and repository relationships already accumulated in it. Architecture synthesis, an incident command thread, and a cross-cutting refactor often do. A bounded review, test run, or documentation pass usually does not; give that work the relevant files and a short brief, then return a compact result. Context is not a trophy for session longevity—it is recurring input rent."]},{id:"delegate",eyebrow:"3 · DELEGATE",title:"Give subagents smaller backpacks.",copy:"A scoped subagent sees only the brief and files it needs.",deep:[`Delegation creates a new context boundary. A 260,000-token Sonnet subagent prefix costs 260,000 × ${Oe.w1h} × $${va.sonnet}/M = ${f(c)} for its first one-hour write, then 260,000 × ${Oe.read} × $${va.sonnet}/M = ${m(u)} per warm read—a ${Oe.w1h/Oe.read}× swing on the prefix. The alternative is not free: a long main session repeatedly reads its larger accumulated history even when the next job needs one directory.`,"Delegate work that can be specified narrowly, checked independently, and returned compactly: searches, bounded reviews, focused tests, and factual docs. Do not delegate a two-minute edit whose brief and result need more tokens than the work, a decision that depends on tacit conversation history, or parallel tasks that will collide in the same files. Keep cross-cutting decisions and final synthesis in the main agent. When several subagents share a stable instruction prefix, preserve it exactly and append the task-specific target afterward so later subagents can read rather than rewrite it."]},{id:"compact",eyebrow:"4 · AUTO-COMPACT",title:"Compress history before it owns you.",copy:"Compaction trades some detail for a smaller reusable prefix.",deep:[`Auto-compact replaces older conversation detail with a shorter working set. The engine compacts after ${Da.thresholdTok.toLocaleString()} history tokens and retains ${Da.workingSetTok.toLocaleString()}; at ${x.toLocaleString()} tokens it reads the history and emits a ${Da.summaryTok.toLocaleString()}-token Haiku summary for ${f(U)}. Removing ${E.toLocaleString()} repeated tokens then saves ${f(Y)} on each warm Sonnet message, before any cold-write saving, so this worked case breaks even after ${C} subsequent warm turns. Compaction is a purchase: pay once for the summary, then earn it back only if the smaller history will be reused.`,"Compact when a coherent summary can replace old exploration and the session still has meaningful work ahead. Do not compact just before stopping, and preserve exact logs, quotations, or code outside the chat when later reasoning needs them verbatim. The useful summary records decisions, rejected hypotheses, invariants, and open questions; a vague recap saves tokens by discarding the very state the agent needed."]},{id:"lazy",eyebrow:"5 · LAZY-LOAD",title:"Load skills and MCPs when called.",copy:"Unused tool descriptions are still context.",deep:[`Skill instructions and MCP schemas are input tokens even when the task never calls them. The engine's eager tool bundle is ${mn.toLocaleString()} tokens; omitting it from a non-tool Sonnet turn saves ${f(Q)} on a one-hour cold write or ${f(z)} on a warm read. One turn is small, but an all-day session pays the warm amount repeatedly, and a changed prefix can pay the cold amount again.`,"Lazy-load when most turns do not need the capability and discovery is cheap. Eager loading is rational when nearly every next turn will call the same tools or when the schema itself is essential planning context; repeatedly discovering and rewriting an immediately needed capability wins nothing. Once loaded, keep the definition stable at the reusable front and put changing arguments later. As with compaction, this is a reuse calculation, not a cleanliness ritual."]}],ke=[{id:"strategy",highlight:"strategy",eyebrow:"0.1 · STRATEGY",title:"Route the work—or route every task the same.",recipe:"route",copy:"Switch only the routing strategy while model, effort, volume, and compaction stay fixed. The comparison exposes the cost of sending every task through one expensive default.",deep:"Right-sizing is not shorthand for choosing the cheapest model. Each task keeps the least costly model-and-effort pairing that fits its judgment burden; the uniform side deliberately applies one selection to every task so the saved amount measures routing alone."},{id:"model",highlight:"model",eyebrow:"0.2 · MODEL",title:"Model price multiplies the whole receipt.",recipe:"route",copy:"Change only the uniform model. The same seven tasks, high effort, full context, and billing buckets are repriced at that model’s engine rate.",deep:"A cheaper model lowers every billed class, but that arithmetic says nothing about whether it can do the job. Use this control to see the rate effect in isolation, then use the task-routing guidance below to account for the cost of being wrong."},{id:"effort",highlight:"effort",eyebrow:"0.3 · EFFORT",title:"Effort changes how much work gets billed.",recipe:"route",copy:"Hold Opus and the seven-task workload steady, then change effort. The
