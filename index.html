ore the TTL. The ledger treats a gap shorter than the TTL as warm; a request at or beyond expiry writes the prefix again at ${Le.w5m}× or ${Le.w1h}× instead of reading it at ${Le.read}×.`,"Approve only commands the workflow already trusts, such as a focused test or a read-only inspection. Keep destructive or surprising operations gated. The saving comes from removing safe, repetitive friction—not from weakening the boundary around risky actions."],script:Y,offScript:ke,onScript:Y,offLabel:"Manual",onLabel:"Auto-approve",off:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},on:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},startOn:!0}],nt=[{id:"route",eyebrow:"1 · MODEL + EFFORT",title:"Match the brain to the job.",copy:"Route by the cost of being wrong: buy judgment where a mistake fans out, and buy throughput where the answer is easy to verify.",deep:[`Model choice changes the base price of every token: Haiku is ${f(Zt.haiku)}, Sonnet ${f(Zt.sonnet)}, Opus ${f(Zt.opus)}, and Fable ${f(Zt.fable)} per million input tokens before bucket multipliers. Effort changes the teaching workload's reasoning input and output, and output is billed at ${Le.out}×, so premium model plus high effort compounds both axes.`,`For the plan, Sonnet-high costs ${f(k("Plan","sonnet","high"))}: architecture and sequencing justify judgment, while Haiku-high at ${f(k("Plan","haiku","high"))} is a false economy if a weak dependency map spawns seven bad implementation tasks, and Fable-high at ${f(k("Plan","fable","high"))} is usually unused headroom. A local, reversible hotfix is the opposite: Haiku-low is ${f(k("Hotfix","haiku","low"))}, while Opus-high is ${f(k("Hotfix","opus","high"))}; escalate only when the blast radius stops being local.`,`Debugging needs a wide hypothesis search, so the worked route spends ${f(k("Debug","opus","high"))} on Opus-high instead of ${f(k("Debug","sonnet","high"))} on a cheaper but underpowered pass whose missed hypothesis buys another edit-and-test loop. RCA also lands on Opus-high at ${f(k("RCA","opus","high"))}, because reproducing the failure and separating cause from symptom demands a defensible chain, not a plausible narrative. Code review is bounded but cross-file: Sonnet-medium costs ${f(k("Code review","sonnet","medium"))}, enough to trace contracts without pricing every diff as research.`,`Tests and docs are cheaper because their answers are externally checkable. Haiku-medium prices the testing job at ${f(k("Tests","haiku","medium"))}; the spec supplies the judgment and the runner supplies the verdict. Haiku-low prices docs at ${f(k("Docs","haiku","low"))}, while Fable-low costs ${f(k("Docs","fable","low"))} and cannot recover facts absent from the brief. “Bad” in the picker therefore means likely to create rework, “expensive” means capacity the task cannot use, and “good” means the least costly route whose failure mode you can tolerate.`]},{id:"main-context",eyebrow:"2 · MAIN AGENT",title:"The default agent carries the whole backpack.",copy:"A 1M-context main agent is powerful—and expensive when every request drags that prefix through the meter.",deep:[`The main agent's million-token context may contain useful history, but the meter sees input carried into this request—not how much of it the task actually needs. On Sonnet, a one-hour cold write of 1,000,000 tokens plus the review output is ${f($.mainCold)}; the next warm message is still ${f($.mainWarm)} because the whole prefix is read at ${Le.read}× and output remains ${Le.out}×. The scoped 14,000-token version with identical output is ${f($.scopedCold)} cold and ${f($.scopedWarm)} warm.`,"The backpack is worth carrying when the next request genuinely depends on decisions, failed attempts, and repository relationships already accumulated in it. Architecture synthesis, an incident command thread, and a cross-cutting refactor often do. A bounded review, test run, or documentation pass usually does not; give that work the relevant files and a short brief, then return a compact result. Context is not a trophy for session longevity—it is recurring input rent."]},{id:"delegate",eyebrow:"3 · DELEGATE",title:"Give subagents smaller backpacks.",copy:"A scoped helper sees only the brief and files it needs.",deep:[`Delegation creates a new context boundary. A 260,000-token Sonnet helper prefix costs 260,000 × ${Le.w1h} × $${Zt.sonnet}/M = ${f(v)} for its first one-hour write, then 260,000 × ${Le.read} × $${Zt.sonnet}/M = ${y(l)} per warm read—a ${Le.w1h/Le.read}× swing on the prefix. The alternative is not free: a long main session repeatedly reads its larger accumulated history even when the next job needs one directory.`,"Delegate work that can be specified narrowly, checked independently, and returned compactly: searches, bounded reviews, focused tests, and factual docs. Do not delegate a two-minute edit whose brief and result need more tokens than the work, a decision that depends on tacit conversation history, or parallel tasks that will collide in the same files. Keep cross-cutting decisions and final synthesis in the main agent. When several helpers share a stable instruction prefix, preserve it exactly and append the task-specific target afterward so later helpers can read rather than rewrite it."]},{id:"compact",eyebrow:"4 · AUTO-COMPACT",title:"Compress history before it owns you.",copy:"Compaction trades some detail for a smaller reusable prefix.",deep:[`Auto-compact replaces older conversation detail with a shorter working set. The engine compacts after ${Qt.thresholdTok.toLocaleString()} history tokens and retains ${Qt.workingSetTok.toLocaleString()}; at ${I.toLocaleString()} tokens it reads the history and emits a ${Qt.summaryTok.toLocaleString()}-token Haiku summary for ${f(T)}. Removing ${A.toLocaleString()} repeated tokens then saves ${f(L)} on each warm Sonnet message, before any cold-write saving, so this worked case breaks even after ${O} subsequent warm turns. Compaction
