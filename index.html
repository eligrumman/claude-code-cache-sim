,title:"Pay a little before expiry.",copy:"A timed read can preserve a valuable prefix across a known medium pause.",deep:[`Keep-warm sends a small request before expiry so the cached prefix is read and its lifetime is refreshed. The request is not free: this simulator bills the full cached prefix at the ${Fe.read}× cache-read rate. For the 68,000-token Sonnet prefix below, each warm read is ${f(h)}; rebuilding it with a five-minute write is ${f(_)}.`,"The decision is a break-even question, not a ritual. Add up the pings needed to bridge the pause and compare them with the rebuild they avoid. Use keep-warm for a known medium wait, then stop it when the session is truly idle; endless reads can eventually cost more than letting the prefix go cold once."],script:Se,offLabel:"No pings",onLabel:"Keep-warm",off:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680},on:{ttl:"5m",model:"sonnet",prefixTok:68e3,workInTok:520,outputTok:680,keepWarm:!0}},{id:"same-prompt",eyebrow:"3 · SAME PROMPT",title:"One word can poison the shared prefix.",copy:"An identical opening lets the whole shared prefix read cheaply; change one word near the front and the big stable tools, skills, and MCP block after it is re-written at full price.",deep:["In the real HEY-versus-HELLO experiment, two byte-identical subagent prompts made the second request a cheap cache read of the shared ~26K prefix. Changing only HEY to HELLO broke the prefix match at that word: only ~12K stayed reusable and about half the prefix—~15K tokens—had to be re-written, including the ~9–10K tools, skills, and MCP block after the message. A changed byte near the front poisons the otherwise stable tail.","Keep the opening bytes identical across subagents, then put the variable task last, after shared skills and tools, so a different tail never poisons the reusable head. The sting is largest for heavy skills and MCP users: divergent chats or subagents otherwise pay to rewrite that large stable block every time. ond expiry writes the prefix again at ${Fe.w5m}× or ${Fe.w1h}× instead of reading it at ${Fe.read}×.`,"Approve only commands the workflow already trusts, such as a focused test or a read-only inspection. Keep destructive or surprising operations gated. The saving comes from removing safe, repetitive friction—not from weakening the boundary around risky actions."],script:M,offScript:ve,onScript:M,offLabel:"Manual",onLabel:"Auto-approve",off:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},on:{ttl:"5m",model:"sonnet",prefixTok:36e3,workInTok:320,outputTok:480},startOn:!0}],ye=[{id:"route",eyebrow:"1 · MODEL + EFFORT",title:"Match the brain to the job.",copy:"Route by the cost of being wrong: buy judgment where a mistake fans out, and buy throughput where the answer is easy to verify.",deep:[`Model choice changes the base price of every token: Haiku is ${f(pa.haiku)}, Sonnet ${f(pa.sonnet)}, Opus ${f(pa.opus)}, and Fable ${f(pa.fable)} per million input tokens before bucket multipliers. Effort changes the teaching workload's reasoning input and output, and output is billed at ${Fe.out}×, so premium model plus high effort compounds both axes.`,`For the plan, Sonnet-high costs ${f(g("Plan","sonnet","high"))}: architecture and sequencing justify judgment, while Haiku-high at ${f(g("Plan","haiku","high"))} is a false economy if a weak dependency map spawns seven bad implementation tasks, and Fable-high at ${f(g("Plan","fable","high"))} is usually unused headroom. A local, reversible hotfix is the opposite: Haiku-low is ${f(g("Hotfix","haiku","low"))}, while Opus-high is ${f(g("Hotfix","opus","high"))}; escalate only when the blast radius stops being local.`,`Debugging needs a wide hypothesis search, so the worked route spends ${f(g("Debug","opus","high"))} on Opus-high instead of ${f(g("Debug","sonnet","high"))} on a cheaper but underpowered pass whose missed hypothesis buys another edit-and-test loop. RCA also lands on Opus-high at ${f(g("RCA","opus","high"))}, because reproducing the failure and separating cause from symptom demands a defensible chain, not a plausible narrative. Code review is bounded but cross-file: Sonnet-medium costs ${f(g("Code review","sonnet","medium"))}, enough to trace contracts without pricing every diff as research.`,`Tests and docs are cheaper because their answers are externally checkable. Haiku-medium prices the testing job at ${f(g("Tests","haiku","medium"))}; the spec supplies the judgment and the runner supplies the verdict. Haiku-low prices docs at ${f(g("Docs","haiku","low"))}, while Fable-low costs ${f(g("Docs","fable","low"))} and cannot recover facts absent from the brief. “Bad” in the picker therefore means likely to create rework, “expensive” means capacity the task cannot use, and “good” means the least costly route whose failure mode you can tolerate.`]},{id:"main-context",eyebrow:"2 · MAIN AGENT",title:"The default agent carries the whole backpack.",copy:"A 1M-context main agent is powerful—and expensive when every request drags that prefix through the meter.",deep:[`The main agent's million-token context may contain useful history, but the meter sees input carried into this request—not how much of it the task actually needs. On Sonnet, a one-hour cold write of 1,000,000 tokens plus the review output is ${f(y.mainCold)}; the next warm message is still ${f(y.mainWarm)} because the whole prefix is read at ${Fe.read}× and output remains ${Fe.out}×. The scoped 14,000-token version with identical output is ${f(y.scopedCold)} cold and ${f(y.scopedWarm)} warm.`,"The backpack is worth carrying when the next request genuinely depends on decisions, failed attempts, and repository relationships already accumulated in it. Architecture synthesis, an incident command thread, and a cross-cutting refactor often do. A bounded review, test run, or documentation pass usually does not; give that work the relevant files and a short brief, then return a compact result. Context is not a trophy for session longevity—it is recurring input rent."]},{id:"delegate",eyebrow:"3 · DELEGATE",title:"Give subagents smaller backpacks.",copy:"A scoped subagent sees only the brief and files it needs.",deep:[`Delegation creates a new context boundary. A 260,000-token Sonnet subagent prefix costs 260,000 × ${Fe.w1h} × $${pa.sonnet}/M = ${f(c)} for its first one-hour write, then 260,000 × ${Fe.read} × $${pa.sonnet}/M = ${b(d)} per warm read—a ${Fe.w1h/Fe.read}× swing on the prefix. The alternative is not free: a long main session repeatedly reads its larger accumulated history even when the next job needs one directory.`,"Delegate work that can be specified narrowly, checked independently, and returned compactly: searches, bounded reviews, focused tests, and factual docs. Do not delegate a two-minute edit whose brief and result need more tokens than the work, a decision that depends on tacit conversation history, or parallel tasks that will collide in the same files. Keep cross-cutting decisions and final synthesis in the main agent. When several subagents share a stable instruction prefix, preserve it exactly and append the task-specific target afterward so later subagents can read rather than rewrite it."]},{id:"compact",eyebrow:"4 · AUTO-COMPACT",title:"Compress history before it owns you.",copy:"Compaction trades some detail for a smaller reusable prefix.",deep:[`Auto-compact replaces older conversation detail with a shorter working set. The engine compacts after ${qa.thresholdTok.toLocaleString()} history tokens and retains ${qa.workingSetTok.toLocaleString()}; at ${x.toLocaleString()} tokens it reads the history and emits a ${qa.summaryTok.toLocaleString()}-token Haiku summary for ${f(O)}. Removing ${E.toLocaleString()} repeated tokens then saves ${f(K)} on each warm Sonnet message, before any cold-write saving, so this worked case breaks even after ${C} subsequent warm turns. Compaction is a purchase: pay once for the summary, then earn it back only if the smaller history will be reused.`,"Compact when a coherent summary can replace old exploration and the session still has meaningful work ahead. Do not compact just before stopping, and preserve exact logs, quotations, or code outside the chat when later reasoning needs them verbatim. The useful summary records decisions, rejected hypotheses, invariants, and open questions; a vague recap saves tokens by discarding the very state the agent needed."]},{id:"lazy",eyebrow:"5 · LAZY-LOAD",title:"Load skills and MCPs when called.",copy:"Unused tool descriptions are still context.",deep:[`Skill instructions and MCP schemas are input tokens even when the task never calls them. The engine's eager tool bundle is ${go.toLocaleString()} tokens; omitting it from a non-tool Sonnet turn saves ${f(G)} on a one-hour cold write or ${f(H)} on a warm read. One turn is small, but an all-day session pays the warm amount repeatedly, and a changed prefix can pay the cold amount again.`,"Lazy-load when most turns do not need the capability and discovery is cheap. Eager loading is rational when nearly every next turn will call the same tools or when the schema itself is essential planning context; repeatedly discovering and rewriting an immediately needed capability wins nothing. Once loaded, keep the definition stable at the reusable front and put changing arguments later. As with compaction, this is a reuse calculation, not a cleanliness ritual."]}],ke=[{id:"strategy",highlight:"strategy",eyebrow:"0.1 · STRATEGY",title:"Route the work—or route every task the same.",recipe:"route",copy:"Switch only the routing strategy while model, effort, volume, and compaction stay fixed. The comparison exposes the cost of sending every task through one expensive default.",deep:"Right-sizing is not shorthand for choosing the cheapest model. Each task keeps the least costly model-and-effort pairing that fits its judgment burden; the uniform side deliberately applies one selection to every task so the saved amount measures routing alone."},{id:"model",highlight:"model",eyebrow:"0.2 · MODEL",title:"Model price multiplies the whole receipt.",recipe:"route",copy:"Change only the uniform model. The same seven tasks, high effort, full context, and billing buckets are repriced at that model’s engine rate.",deep:"A cheaper model lowers every billed class, but that arithmetic says nothing about whether it can do the job. Use this control to see the rate effect in isolation, then use the task-routing guidance below to account for the cost of being wrong."},{id:"effort",highlight:"effort",eyebrow:"0.3 · EFFORT",title:"Effort changes how much work gets billed.",recipe:"route",copy:"Hold Opus and the seven-task workload steady, then change effort. The model scales the task input and generated output before the shared pricing engine totals them.",deep:"High effort is valuable when deeper search prevents rework; it is waste when tests or a narrow specification already make the answer easy to verify. This focused view isolates token-volume changes from model and routing changes."},{id:"volume",highlight:"volume",eyebrow:"0.4 · VOLUME",title:"A workday scales one task at a time.",recipe:"delegate",copy:"Move only tasks per day. The workload repeats the documented task mix, so every added task contributes its own input, cached context, and output rather than multiplying a hardcoded dollar estimate.",deep:"Volume makes a small per-task mismatch recur. After the seven named task types, later tasks repeat the same deterministic route cycle; the bar and total are recomputed from those rows through macroLabComparison."},{id:"compaction",highlight:"compaction",eyebrow:"0.5 · COMPACTION",title:"Carry less context into the next task.",recipe:"compact",copy:"Change only the share of cached context dropped before later tasks. The readout compares the selected workload with and without that reduction.",deep:"This teaching model reduces later cache-read prefixes; it does not claim measured savings or pri
