rst subagent below writes the shared instructions at ${he.w1h}×; each later subagent with the same prefix reads those tokens at ${he.read}×. A different leading message invalidates the cache from the first byte of divergence, and the miss cascades: the skills block, tools block, and everything downstream must be written again at full price.`,`That is a ${he.w1h/he.read}× cold-versus-warm gap before fresh task input and output are added. Keep the prefix byte-identical through the last shared breakpoint. Put the specific task last, after shared skills and tools, so a different tail never poisons the reusable head.`],script:ue,offScript:re,onScript:ue,offLabel:"Unique prompts",onLabel:"Same prompt",off:{ttl:"1h",model:"sonnet",prefixTok:44e3,workInTok:380,outputTok:520},on:{ttl:"1h",model:"sonnet",prefixTok:44e3,workInTok:380,outputTok:520},startOn:!0},{id:"large-context",eyebrow:"4 · LARGE CONTEXT",title:"Reuse the big prefix—or pay again.",copy:"A large context magnifies both the first cold write and every saving after it.",deep:[`Context is input on every request; caching only changes which input bucket receives it. Sonnet's base input price is ${p(Zt.sonnet)} per million tokens, so the 420,000-token prefix below costs ${p(b)} as a one-hour cold write and ${p(w)} as a warm read. A larger prefix makes both numbers larger in direct proportion.`,"Put stable system instructions, tool definitions, and repository context first, then append the changing task. That layout preserves a reusable prefix across turns. Cache eligibility thresholds are provider and model rules; because this pricing source declares no numeric minimum, the article does not fabricate one."],script:te,offScript:A,onScript:te,offLabel:"Rebuild each turn",onLabel:"Reuse prefix",off:{ttl:"1h",model:"sonnet",prefixTok:42e4,workInTok:1100,outputTok:1450},on:{ttl:"1h",model:"sonnet",prefixTok:42e4,workInTok:1100,outputTok:1450},startOn:!0},{id:"auto-approve",eyebrow:"5 · AUTO-APPROVE",title:"Fewer round-tri
